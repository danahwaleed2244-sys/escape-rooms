<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غرفة الهروب: أنظمة المعادلات الخطية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* عالم واحد: قبو ليلي بلون الحبر، ونحاس دافئ للأقفال والمفاتيح */
  --ink:#0f1a24;
  --panel:#172634;
  --panel-2:#1e3142;
  --line:#2e4659;
  --text:#eef2f5;
  --muted:#9fb3c3;
  --brass:#e3a94b;
  --brass-dk:#b9822c;
  --ok:#4fc08d;
  --bad:#e86a5c;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.7}
body{min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:0;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:2rem;color:var(--brass)}
h2{font-size:1.45rem}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
button{font-family:var(--body);font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{background:var(--brass);color:#1b1206;border:0;border-radius:10px;padding:12px 20px;font-weight:800}
.btn:hover{background:#f0b95c}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text],select{width:100%;font:inherit;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field{display:flex;flex-direction:column}
.form{display:grid;gap:14px}

/* خريطة الغرف */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.door{background:var(--panel-2);border:1px solid var(--line);border-radius:10px 10px 4px 4px;padding:10px 4px 8px;text-align:center;font-size:.8rem;line-height:1.35;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.door svg{width:26px;height:26px}
.door.open{border-color:var(--ok);color:var(--text)}
.door.now{border-color:var(--brass);color:var(--text);box-shadow:0 0 0 2px rgba(227,169,75,.25)}

/* رأس الغرفة */
.roomhead{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);color:var(--brass);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:48px;height:56px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.6rem;font-weight:800;color:var(--brass);background:var(--ink)}
.slot.got{border-style:solid;border-color:var(--brass)}

/* السؤال */
.qnum{font-size:.9rem;color:var(--muted);font-weight:700}
.qtext{font-size:1.12rem;font-weight:500}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--panel-2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.08rem;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt .k{flex:0 0 32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--brass);font-weight:800}
.opt.wrong{border-color:var(--bad);opacity:.55;text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.right{border-color:var(--ok);background:rgba(79,192,141,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:14px;line-height:1.85}
.fb.hint{background:rgba(232,106,92,.1);border:1px solid rgba(232,106,92,.45)}
.fb.sol{background:rgba(79,192,141,.08);border:1px solid rgba(79,192,141,.45)}
.fb b{display:block;margin-bottom:4px}
.digit{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;color:var(--brass)}
.digit span.big{font-size:1.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* الرمز */
.codebox{display:flex;gap:8px;justify-content:center}
.codebox input{width:52px;height:60px;text-align:center;font-size:1.6rem;font-weight:800;background:var(--ink);color:var(--brass);border:2px solid var(--line);border-radius:8px;font-family:var(--body)}
.err{color:var(--bad);font-weight:700;text-align:center}

/* الشهادة */
.cert{border:2px solid var(--brass);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert .name{font-family:var(--display);font-size:1.8rem;color:var(--brass)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 4px}
.stat .v{font-size:1.4rem;font-weight:800}
.stat .l{font-size:.8rem;color:var(--muted)}
.praise{display:flex;flex-direction:column;gap:10px;background:var(--panel-2);border-radius:12px;padding:16px;width:100%;line-height:1.9}
.praise .pt{font-family:var(--display);font-size:1.35rem;color:var(--ok)}
.praise .thanks{border-top:1px solid var(--line);padding-top:10px;font-weight:700}

/* الرياضيات: كل تعبير معزول باتجاه من اليمين لليسار مثل الكتاب */
.m{unicode-bidi:isolate;direction:rtl;white-space:nowrap;font-weight:700}
.m bdi{unicode-bidi:isolate}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.85em;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span{padding:0 3px}
sup{font-size:.7em;line-height:0}
.steps{display:block}
.pl{width:100%;display:block;margin:10px auto 0}
.tbl{overflow-x:auto;margin-top:10px}.tbl table{border-collapse:collapse;margin:0 auto;font-weight:700}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 12px;text-align:center}.tbl th{color:var(--brass);font-weight:700}
.opt .pl{margin:0}
.nl{width:100%;max-width:420px;display:block;margin:10px auto 0}
.shape{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.shape svg{max-width:220px;width:46%}

.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:400px){html,body{font-size:17px}.slot{width:42px;height:50px}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ===== أدوات كتابة الرياضيات ===== */
const M = s => `<span class="m">${s}</span>`;
const F = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const P = (base,exp) => `<bdi>${base}</bdi><bdi><sup>${exp}</sup></bdi>`;

function numberLine(points, lo=-5, hi=6){
  // خط أعداد، والسالب يسار مثل الكتاب
  const ar = n => String(Math.abs(n)).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  const step = 330/(hi-lo);
  const x = n => 30 + (n-lo)*step;
  let s = `<svg class="nl" viewBox="0 0 390 62" direction="ltr" role="img" aria-label="خط أعداد">`;
  s += `<line x1="8" y1="22" x2="382" y2="22" stroke="#9fb3c3" stroke-width="2"/>`;
  s += `<path d="M8 22 l10 -6 v12z M382 22 l-10 -6 v12z" fill="#9fb3c3"/>`;
  for(let n=lo;n<=hi;n++){
    s += `<line x1="${x(n)}" y1="15" x2="${x(n)}" y2="29" stroke="#9fb3c3" stroke-width="2"/>`;
    s += `<text x="${x(n)}" y="50" fill="#eef2f5" font-size="15" font-family="Tajawal" text-anchor="middle" direction="rtl">${n<0?'−':''}${ar(n)}</text>`;
  }
  points.forEach(p=> s += `<circle cx="${x(p)}" cy="22" r="7" fill="#e3a94b"/>`);
  return s + `</svg>`;
}

const areaQ = `<div class="shape">
<svg viewBox="0 0 220 140" role="img" aria-label="المستطيل الأول">
 <rect x="45" y="15" width="150" height="80" fill="none" stroke="#e3a94b" stroke-width="2.5"/>
 <text x="120" y="122" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">س + ٣</text>
 <text x="25" y="60" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">٨</text>
</svg>
<svg viewBox="0 0 220 140" role="img" aria-label="المستطيل الثاني">
 <rect x="45" y="30" width="150" height="60" fill="none" stroke="#e3a94b" stroke-width="2.5"/>
 <text x="120" y="117" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">س + ٧</text>
 <text x="25" y="66" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">٦</text>
</svg></div>`;

const shapesQ = `<div class="shape">
<svg viewBox="0 0 220 130" role="img" aria-label="مستطيل">
 <rect x="40" y="20" width="160" height="70" fill="none" stroke="#e3a94b" stroke-width="2.5"/>
 <text x="120" y="115" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">س + ١٣</text>
 <text x="22" y="60" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">٢س</text>
</svg>
<svg viewBox="0 0 220 130" role="img" aria-label="مثلث">
 <polygon points="45,15 45,95 205,95" fill="none" stroke="#e3a94b" stroke-width="2.5"/>
 <text x="125" y="120" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">٢س + ٥</text>
 <text x="22" y="62" fill="#eef2f5" font-size="15" font-family="Tajawal" text-anchor="middle" direction="rtl" transform="rotate(-90 22 58)">٣س + ٤</text>
 <text x="140" y="45" fill="#eef2f5" font-size="17" font-family="Tajawal" text-anchor="middle" direction="rtl">٥س + ١</text>
</svg></div>`;

/* ===== رسومات: مستوى إحداثي، مخطط سهمي، تمثيل وصفي ===== */
const ARD = n => String(Math.abs(n)).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const C='#e3a94b', G='#9fb3c3', GL='#2e4659', TX='#eef2f5';

// مستوى إحداثي من -r إلى r مع نقاط و/أو مستقيمات
function PL(o){
  const r=o.r||5, sz=o.size||220, pad=14, u=(sz-2*pad)/(2*r);
  const X=x=>pad+(x+r)*u, Y=y=>pad+(r-y)*u;
  let s=`<svg class="pl" viewBox="0 0 ${sz} ${sz}" style="max-width:${sz}px" direction="ltr" role="img" aria-label="مستوى إحداثي">`;
  for(let i=-r;i<=r;i++){ s+=`<line x1="${X(i)}" y1="${Y(-r)}" x2="${X(i)}" y2="${Y(r)}" stroke="${GL}" stroke-width="1"/><line x1="${X(-r)}" y1="${Y(i)}" x2="${X(r)}" y2="${Y(i)}" stroke="${GL}" stroke-width="1"/>`; }
  s+=`<line x1="${X(-r)}" y1="${Y(0)}" x2="${X(r)}" y2="${Y(0)}" stroke="${G}" stroke-width="2"/><line x1="${X(0)}" y1="${Y(-r)}" x2="${X(0)}" y2="${Y(r)}" stroke="${G}" stroke-width="2"/>`;
  s+=`<text x="${X(r)-4}" y="${Y(0)-5}" fill="${TX}" font-size="12" font-family="Tajawal" text-anchor="end">س</text><text x="${X(0)+5}" y="${Y(r)+11}" fill="${TX}" font-size="12" font-family="Tajawal">ص</text>`;
  (o.ticks||[]).forEach(([v,axis])=>{
    const lbl=(v<0?'−':'')+ARD(v);
    if(axis==='x') s+=`<text x="${X(v)}" y="${Y(0)+13}" fill="${TX}" font-size="11" font-family="Tajawal" text-anchor="middle" direction="rtl">${lbl}</text>`;
    else s+=`<text x="${X(0)-4}" y="${Y(v)+4}" fill="${TX}" font-size="11" font-family="Tajawal" text-anchor="end" direction="rtl">${lbl}</text>`;
  });
  (o.lines||[]).forEach(([x1,y1,x2,y2])=> s+=`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${C}" stroke-width="3"/>`);
  (o.paths||[]).forEach(d=> s+=`<path d="${d.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ')}" fill="none" stroke="${C}" stroke-width="3"/>`);
  (o.points||[]).forEach(([x,y])=> s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${C}"/>`);
  (o.labels||[]).forEach(([x,y,t,dx,dy])=> s+=`<text x="${X(x)+(dx||0)}" y="${Y(y)+(dy||0)}" fill="${TX}" font-size="13" font-weight="700" font-family="Tajawal" text-anchor="middle">${t}</text>`);
  return s+`</svg>`;
}

// مخطط سهمي: المجال يمين والمدى يسار كما في الكتاب
function MAP(dom, rng, pairs){
  const h=Math.max(dom.length,rng.length)*34+40;
  const yD=i=>30+i*34+(Math.max(dom.length,rng.length)-dom.length)*17;
  const yR=i=>30+i*34+(Math.max(dom.length,rng.length)-rng.length)*17;
  const lab=v=>(v<0?'−':'')+ARD(v);
  let s=`<svg class="pl" viewBox="0 0 240 ${h}" style="max-width:240px" direction="ltr" role="img" aria-label="مخطط سهمي">`;
  s+=`<text x="190" y="14" fill="${G}" font-size="12" font-family="Tajawal" text-anchor="middle">المجال</text><text x="50" y="14" fill="${G}" font-size="12" font-family="Tajawal" text-anchor="middle">المدى</text>`;
  s+=`<rect x="165" y="20" width="50" height="${h-28}" rx="22" fill="none" stroke="${G}" stroke-width="1.5"/><rect x="25" y="20" width="50" height="${h-28}" rx="22" fill="none" stroke="${G}" stroke-width="1.5"/>`;
  s+=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="${C}"/></marker></defs>`;
  pairs.forEach(([a,b])=> s+=`<line x1="175" y1="${yD(dom.indexOf(a))}" x2="68" y2="${yR(rng.indexOf(b))}" stroke="${C}" stroke-width="2" marker-end="url(#ah)"/>`);
  dom.forEach((v,i)=> s+=`<text x="195" y="${yD(i)+5}" fill="${TX}" font-size="15" font-family="Tajawal" text-anchor="middle" direction="rtl">${lab(v)}</text>`);
  rng.forEach((v,i)=> s+=`<text x="48" y="${yR(i)+5}" fill="${TX}" font-size="15" font-family="Tajawal" text-anchor="middle" direction="rtl">${lab(v)}</text>`);
  return s+`</svg>`;
}

// تمثيل وصفي (بلا تدريج): محور الزمن ومحور الكمية
function STORY(pts, yl, xl){
  let s=`<svg class="pl" viewBox="0 0 240 170" style="max-width:240px" direction="ltr" role="img" aria-label="تمثيل بياني">`;
  s+=`<line x1="30" y1="140" x2="230" y2="140" stroke="${G}" stroke-width="2"/><line x1="30" y1="140" x2="30" y2="10" stroke="${G}" stroke-width="2"/>`;
  s+=`<text x="130" y="162" fill="${TX}" font-size="12" font-family="Tajawal" text-anchor="middle">${xl}</text><text x="16" y="75" fill="${TX}" font-size="12" font-family="Tajawal" text-anchor="middle" transform="rotate(-90 16 75)">${yl}</text>`;
  s+=`<polyline points="${pts.map(([x,y])=>`${30+x*2} ${140-y*1.3}`).join(' ')}" fill="none" stroke="${C}" stroke-width="3"/>`;
  return s+`</svg>`;
}

/* ===== الغرف والأسئلة ===== */
const ROOMS = [
 { name:"غرفة التقاطع", lesson:"حل نظام من معادلتين خطيتين بيانيًا", code:"61827",
   intro:"الباب مقفل برمز من خمسة أرقام. حل النظام هو نقطة تقاطع المستقيمين، وعدد نقاط التقاطع هو عدد الحلول.",
   qs:[
   { q:`ما حل النظام الممثل بيانيًا في الشكل، وكيف يوصف؟${PL({r:5,size:210,lines:[[0,5,5,-5],[-5,-3,3,5]],points:[[1,3]],ticks:[[3,'y'],[1,'x']]})}`,
     o:[ `${M('(٣، ١)')}، والنظام متسق ومستقل`, `${M('(١، ٣)')}، والنظام متسق ومستقل`, `${M('(١، ٣)')}، والنظام متسق وغير مستقل`, `${M('(١، ٣)')}، والنظام غير متسق` ], a:1,
     hint:`الحل هو نقطة التقاطع، وتُكتب (س، ص). ومستقيمان يتقاطعان في نقطة واحدة فقط يعطيان نظامًا له حل واحد.`,
     sol:`المستقيمان يتقاطعان في النقطة ${M('(١، ٣)')}: س = ١ و ص = ٣.<br>للنظام حل واحد فقط، إذن هو متسق ومستقل.<br>الخيار ${M('(٣، ١)')} عكس ترتيب الإحداثيين.` },
   { q:`ما عدد حلول النظام: ${M('ص = ٢س + ٣')} ، ${M('٤س − ٢ص = −٦')}؟`,
     o:[ 'حل واحد', 'لا يوجد حل', 'عدد لا نهائي من الحلول', 'حلان' ], a:2,
     hint:`اكتبي المعادلة الثانية بصيغة الميل والمقطع، ثم قارني الميلين والمقطعين.`,
     sol:`${M('−٢ص = −٤س − ٦')} ← ${M('ص = ٢س + ٣')}<br>المعادلتان تمثلان المستقيم نفسه: الميل نفسه والمقطع نفسه.<br>إذن للنظام عدد لا نهائي من الحلول، وهو متسق وغير مستقل.` },
   { q:`يملك وائل ٤٠ ريالًا ويوفر ١٠ ريالات كل أسبوع، ويملك رياض ١٦ ريالًا ويوفر ١٤ ريالًا كل أسبوع. بعد كم أسبوع يصبح ما مع كل منهما متساويًا؟`,
     o:[ M('٤ أسابيع'), M('٦ أسابيع'), M('١٠ أسابيع'), M('٢٤ أسبوعًا') ], a:1,
     hint:`اكتبي معادلة لكل منهما: ${M('ص = ١٠س + ٤٠')} و ${M('ص = ١٤س + ١٦')}. متى تتساوى قيمتا ص؟`,
     sol:`${M('١٠س + ٤٠ = ١٤س + ١٦')}<br>${M('٢٤ = ٤س')} ← ${M('س = ٦')} أسابيع<br>تحقق: وائل ${M('١٠(٦) + ٤٠ = ١٠٠')}، ورياض ${M('١٤(٦) + ١٦ = ١٠٠')}.` },
   { q:`نظام من معادلتين خطيتين، كل من الزوجين ${M('(٠، ٠)')} و ${M('(٢، ٢)')} حل له. هل يكون له حلول أخرى؟`,
     o:[ 'لا، له هذان الحلان فقط', 'أحيانًا، حسب المعادلتين', 'نعم دائمًا، فله عدد لا نهائي من الحلول', 'لا يمكن أن يكون للنظام حلان' ], a:2,
     hint:`مستقيمان مختلفان يتقاطعان في نقطة واحدة على الأكثر. فإذا اشتركا في نقطتين، فماذا يعني ذلك؟`,
     sol:`المستقيمان يمران كلاهما بالنقطتين ${M('(٠، ٠)')} و ${M('(٢، ٢)')}.<br>ومن نقطتين يمر مستقيم واحد فقط، إذن المستقيمان متطابقان.<br>فللنظام دائمًا عدد لا نهائي من الحلول، كل نقاط المستقيم ${M('ص = س')}.` },
   { q:`أي الأنظمة الآتية يختلف عن الأنظمة الثلاثة الأخرى؟`,

/* ===== الحالة ===== */
const KEY = "escape-linear-systems-v1";
const LETTERS = ['أ','ب','ج','د'];
const AR = s => String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const EN = s => String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
let S = load() || fresh();
function fresh(){ return {name:"",cls:"",room:-1,q:0,stage:"start",got:[],tried:[],mistakes:0,start:0,end:0}; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const lockSvg = open => open
 ? `<svg viewBox="0 0 24 24" fill="none" stroke="#4fc08d" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>`
 : `<svg viewBox="0 0 24 24" fill="none" stroke="#e3a94b" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

function mapHtml(){
  const names = ROOMS.map(r=>r.name.replace('غرفة ','')).concat(['باب الخروج']);
  return `<div class="map">${names.map((n,i)=>{
    const done = i < S.room || S.stage==='done';
    const now = i === S.room && S.stage!=='done';
    return `<div class="door ${done?'open':''} ${now?'now':''}">${lockSvg(done)}<span>${n}</span></div>`;
  }).join('')}</div>`;
}

function render(){
  if(S.stage==='start') return renderStart();
  if(S.stage==='done') return renderDone();
  if(S.stage==='code') return renderCode();
  if(S.room === ROOMS.length) return renderQ(EXIT, true);
  return renderQ(ROOMS[S.room].qs[S.q], false);
}

function renderStart(){
  app.innerHTML = `

  </header>

    <button class="btn" type="submit">ادخلي الغرفة الأولى</button>
  </form>
  <div class="card"><p><b>القواعد</b></p><p class="muted">إذا أخطأتِ يظهر لك تلميح، وتقدرين تجربين مرة ثانية. إذا أصبتِ يظهر لك الحل بالخطوات. حلّي في دفترك قبل ما تختارين. في النهاية تظهر لك شهادة الهروب: صوّريها وأرسليها لمعلمتك أ.&nbsp;لطفيه الطلحي في تيمز.</p></div>`;
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById('nm').value.trim(), c = document.getElementById('cl').value.trim();
    if(!n || !c) return;
    Object.assign(S,{name:n,cls:c,room:0,q:0,stage:'q',got:[],tried:[],mistakes:0,start:Date.now()});
    save(); render(); window.scrollTo(0,0);
  };
}

function slotsHtml(){
  const r = ROOMS[S.room];
  return `<div class="slots" aria-label="أرقام الرمز">${[...r.code].map((_,i)=>{
    const g = S.got[i] != null;
    return `<div class="slot ${g?'got':''}">${g?AR(r.code[i]):''}</div>`;
  }).join('')}</div>`;
}

function renderQ(item, isExit){
  const r = isExit ? null : ROOMS[S.room];
  const answered = isExit ? S.stage==='exitSolved' : S.got[S.q] != null;
  app.innerHTML = `
  ${mapHtml()}
  <header class="roomhead">
    <span class="tag">${isExit ? 'الباب الأخير' : `الغرفة ${AR(S.room+1)} · ${r.lesson}`}</span>
    <h2>${isExit ? 'باب الخروج' : r.name}</h2>
    ${!isExit && S.q===0 && !answered ? `<p class="muted">${r.intro}</p>` : ''}
  </header>
  ${isExit ? '' : slotsHtml()}
  <section class="card" id="qc">
    <div class="qnum">${isExit ? 'السؤال الأخير' : `السؤال ${AR(S.q+1)} من ${AR(ROOMS[S.room].qs.length)}`}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts">${item.o.map((o,i)=>{
      const wrong = S.tried.includes(i);
      const right = answered && i===item.a;
      return `<button class="opt ${wrong?'wrong':''} ${right?'right':''}" data-i="${i}" ${answered||wrong?'disabled':''}><span class="k">${LETTERS[i]}</span><span>${o}</span></button>`;
    }).join('')}</div>
    <div id="fb">${fbHtml(item, answered, isExit)}</div>
  </section>
  <div class="foot"><span class="muted">${esc(S.name)} · ${esc(S.cls)}</span><span class="muted">الأخطاء: ${AR(S.mistakes)}</span></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i, item, isExit));
  const nx = document.getElementById('nx');
  if(nx) nx.onclick = () => next(isExit);
}

function fbHtml(item, answered, isExit){
  if(answered){
    const digit = isExit ? '' : `<div class="digit pop">حصلتِ على رقم من الرمز: <span class="big">${AR(ROOMS[S.room].code[S.q])}</span></div>`;
    const last = !isExit && S.q===ROOMS[S.room].qs.length-1;
    return `<div class="fb sol"><b>إجابة صحيحة. طريقة الحل:</b><span class="steps">${item.sol}</span></div>${digit}
      <div class="row" style="margin-top:14px"><button class="btn" id="nx">${isExit ? 'اخرجي من القبو' : last ? 'اذهبي إلى القفل' : 'السؤال التالي'}</button></div>`;
  }
  if(S.tried.length) return `<div class="fb hint"><b>ليست الإجابة الصحيحة. تلميح:</b>${item.hint}</div>`;
  return '';
}

function choose(i, item, isExit){
  if(i === item.a){
    if(isExit) S.stage='exitSolved'; else S.got[S.q] = true;
  } else {
    S.tried.push(i); S.mistakes++;
  }
  save(); render();
  if(i !== item.a){ const c=document.getElementById('qc'); c.classList.add('shake'); }
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(isExit){
  S.tried = [];
  if(isExit){ S.stage='done'; S.end=Date.now(); }
  else if(S.q < ROOMS[S.room].qs.length-1){ S.q++; }
  else { S.stage='code'; }
  save(); render(); window.scrollTo(0,0);
}

function renderCode(){
  const r = ROOMS[S.room];
  app.innerHTML = `
  ${mapHtml()}
  <header class="roomhead"><span class="tag">الغرفة ${AR(S.room+1)} · القفل</span><h2>افتحي قفل ${r.name}</h2>
  <p class="muted">اكتبي أرقام الرمز بالترتيب نفسه الذي حصلتِ عليه.</p></header>
  ${slotsHtml()}
  <form class="card form" id="cf">
    <div class="codebox">${[...r.code].map((_,i)=>`<input id="c${i}" inputmode="numeric" maxlength="1" aria-label="الرقم ${i+1}">`).join('')}</div>
    <p class="err" id="ce" hidden>الرمز غير صحيح. راجعي الأرقام في الخانات بالأعلى.</p>
    <button class="btn" type="submit">افتحي الباب</button>
  </form>`;
  const ins = [...r.code].map((_,i)=>document.getElementById('c'+i));
  ins.forEach((inp,i)=>{
    inp.oninput = () => { inp.value = AR(EN(inp.value).replace(/\D/g,'').slice(-1)); if(inp.value && ins[i+1]) ins[i+1].focus(); };
    inp.onkeydown = e => { if(e.key==='Backspace' && !inp.value && ins[i-1]) ins[i-1].focus(); };
  });
  ins[0].focus();
  document.getElementById('cf').onsubmit = e => {
    e.preventDefault();
    const v = ins.map(x=>EN(x.value)).join('');
    if(v === r.code){
      S.room++; S.q=0; S.got=[]; S.tried=[]; S.stage='q'; save(); render(); window.scrollTo(0,0);
    } else {
      document.getElementById('ce').hidden = false; document.getElementById('cf').classList.remove('shake'); void document.getElementById('cf').offsetWidth; document.getElementById('cf').classList.add('shake');
    }
  };
}

function renderDone(){
  const mins = Math.max(1, Math.round((S.end - S.start)/60000));
  const d = new Date(S.end);
  const date = d.toLocaleDateString('ar-SA-u-ca-gregory-nu-arab',{day:'numeric',month:'long',year:'numeric'});
  const time = d.toLocaleTimeString('ar-SA-u-nu-arab',{hour:'numeric',minute:'2-digit'});
  const praise = S.mistakes === 0
    ? {title:'أداء كامل بدون أي خطأ!', body:'فهمك للمتباينات الخطية واضح وقوي. حافظي على هذا المستوى، وراجعي بنفس الهمة، والدرجة الكاملة في الاختبار بإذن الله قريبة منك.'}
    : S.mistakes <= 4
    ? {title:'إنجاز رائع!', body:'أخطاؤك قليلة، وكل خطأ صححتيه صار خطوة تعلمتِها. ارجعي للأسئلة اللي توقفتِ عندها مرة ثانية، وبتدخلين الاختبار بثقة بإذن الله.'}
    : {title:'ما استسلمتِ ووصلتِ!', body:'كل محاولة خاطئة كانت درسًا، والمهم إنك كملتِ حتى فتحتِ كل الأبواب. أعيدي الغرفة مرة ثانية وبتلاحظين بنفسك كم تحسنتِ. الاستمرار هو سر النجاح.'};
  app.innerHTML = `
  ${mapHtml()}
  <section class="card cert pop">
    <span class="tag">شهادة الهروب · الفصل الخامس: أنظمة المعادلات الخطية</span>
    <h1>هربتِ من القبو</h1>
    <div class="name">${esc(S.name)}</div>
    <p class="muted">الفصل ${esc(S.cls)} · ${date} · ${time}</p>
    <div class="stats">
      <div class="stat"><div class="v">${AR(ROOMS.reduce((n,r)=>n+r.qs.length,0)+1)}</div><div class="l">سؤالًا محلولًا</div></div>
      <div class="stat"><div class="v">${AR(S.mistakes)}</div><div class="l">محاولة خاطئة</div></div>
      <div class="stat"><div class="v">${AR(mins)}</div><div class="l">دقيقة</div></div>
    </div>
    <div class="praise">
      <p class="pt">${praise.title}</p>
      <p>${praise.body}</p>
      <p class="thanks">شكرًا لكِ يا ${esc(S.name.split(/\s+/)[0])} على جهدك وصبرك حتى آخر باب. فخورة بكِ، وأنتظر أن أراكِ في الغرفة القادمة.<br><span class="muted">معلمتك: أ.&nbsp;لطفيه الطلحي</span></p>
    </div>
    <p class="muted">صوّري هذه الشهادة وأرسليها لمعلمتك أ.&nbsp;لطفيه الطلحي في تيمز.</p>
  </section>
  <div class="row"><button class="btn ghost" id="again">ابدئي من جديد</button></div>`;
  document.getElementById('again').onclick = () => { const n=S.name, c=S.cls; S=fresh(); S.name=n; S.cls=c; save(); render(); window.scrollTo(0,0); };
}

render();
</script>
</body>
</html>
